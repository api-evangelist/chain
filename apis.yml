name: Chain
description: >-
  Chain is a stablecoin payments infrastructure platform that lets enterprises move money
  globally across both traditional banking rails and digital-currency networks. Its unified
  REST API covers funding, payouts and payees; virtual and physical card issuing; wallet
  registration with compliance screening; and a double-entry ledger for reconciliation. Chain
  connects ACH, Fedwire, FedNow, SEPA, Faster Payments, Visa and Mastercard with multi-stablecoin
  support (USDC, USDT, USDP, RLUSD) for real-time settlement and payouts to 200+ countries. The
  platform exposes API-key (Bearer) authentication, an idempotency-key header, webhooks with
  signature verification, and separate sandbox and live environments for developers.
